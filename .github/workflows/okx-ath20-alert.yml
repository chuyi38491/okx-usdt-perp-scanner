name: OKX Watchlist ATL Plus 20 Percent Alert

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okx-ath20-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check OKX watchlist and send new threshold alerts
        env:
          OKX_WATCHLIST: ${{ secrets.OKX_WATCHLIST }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        run: python outputs/daily_report_package/okx_ath20_monitor.py

      - name: Save alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add okx_ath20_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update OKX ATL alert state"
            git push
          fi
